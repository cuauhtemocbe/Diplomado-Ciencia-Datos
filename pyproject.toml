[tool.poetry]
name = "diplomado"
version = "0.2.0"
description = ""
authors = ["Kuautli <cuauhtemocbe@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.25.0"
plotly = "^5.16.0"
python-dotenv = "^1.0.1"
scipy = "^1.11.3"
scikit-learn = "^1.4.2"
pandas = "^2.2.3"
matplotlib = "^3.9.0"
seaborn = "^0.13.2"
ipywidgets = "^8.1.3"
beautifulsoup4 = "^4.12.3"
cufflinks = "^0.17.3"
unidecode = "^1.3.8"
phik = "^0.12.4"
yellowbrick = "^1.5"
statsmodels = "^0.14.6"
# xgboost is unconditionally imported at module level by
# src/data_analysis_octopus.py (used by roughly half the notebooks), so it
# can't be an optional group without breaking that shared helper everywhere.
# Using xgboost-cpu instead of xgboost: same `import xgboost` module (same
# upstream project, CPU-only build) but the regular `xgboost` PyPI wheel
# unconditionally pulls in nvidia-nccl-cu12 (a ~1GB CUDA runtime lib) on
# Linux even when no GPU is used -- xgboost-cpu drops that dependency
# entirely, which is most of what kept the core image over the #14 2GB
# budget.
xgboost-cpu = "^2.1.4"

# Notebook-cluster groups (see CLAUDE.md for the group-to-notebook mapping).
# Installed on top of the main dependencies above via `poetry install --with <group>`.
[tool.poetry.group.tensorflow]
optional = true
[tool.poetry.group.tensorflow.dependencies]
tensorflow = "^2.17.0"
keras = "^3.5.0"
tf-keras = "^2.17.0"

[tool.poetry.group.nlp]
optional = true
[tool.poetry.group.nlp.dependencies]
sentence-transformers = "^3.0.1"
umap-learn = "^0.5.6"
google-api-python-client = "^2.143.0"
flask = "^3.0.3"
gunicorn = "^23.0.0"
wordcloud = "^1.9.3"

[tool.poetry.group.geo]
optional = true
[tool.poetry.group.geo.dependencies]
geopandas = "^1.0.1"
pyproj = "^3.6.1"

[tool.poetry.group.bio]
optional = true
[tool.poetry.group.bio.dependencies]
wfdb = "^4.1.2"
neurokit2 = "^0.2.9"

[tool.poetry.group.explain]
optional = true
[tool.poetry.group.explain.dependencies]
shap = "^0.46.0"
nltk = "^3.8.1"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
nbformat = "^5.10.4"
jupyterlab = "^4.1.6"
varclushi = "^0.1.0"
black = "^24.4.2"
isort = "^5.13.2"
pylint = "^3.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
# Matches pytest's own pythonpath config (see [tool.pytest.ini_options]
# below) — without this, pylint can't resolve `from app_clustering import
# clustering` since app_clustering/ lives under src/, not the repo root.
source-roots = ["src"]

[tool.pylint."messages control"]
# This repo is exploratory/educational data-science code (notebooks +
# supporting src/ modules), not a production service — several default
# pylint checks fight conventions that are standard in that context
# rather than catching real bugs. Disabled deliberately, not by default:
#   - invalid-name: X_train/X_test/X/Q1/Q3/IQR are scikit-learn/stats
#     convention, not a naming-style violation.
#   - missing-*-docstring / empty-docstring: most functions here are
#     short, single-purpose analysis helpers; low value for this repo.
#   - line-too-long: plotting/pandas chains are frequently long one-liners.
#   - too-many-arguments/positional-arguments/locals: inherent to
#     multi-parameter ML pipeline functions, not a sign of bad design here.
#   - use-dict-literal: dict(...) is idiomatic in plotly's own API surface.
#   - unused-variable/unused-argument: common in exploratory code
#     (discarded plot handles, callback-required signatures).
#   - redefined-outer-name: parameters intentionally shadowing a
#     module-level default (e.g. api_key) is an explicit-dependency
#     pattern, not a bug.
#   - broad-exception-caught: acceptable for top-level notebook/app
#     error handling in a solo-maintainer project.
#   - no-member: googleapiclient's `Resource` objects (youtube.videos(),
#     youtube.commentThreads()) are built dynamically at runtime from a
#     discovery document, not real classes pylint can introspect.
#   - arguments-differ: scikit-learn transformer subclasses idiomatically
#     narrow TransformerMixin's generic fit_transform signature.
#   - duplicate-code: the one flagged instance is a shared tuple-unpacking
#     call convention between app.py's view and clustering.py's own
#     return, not accidental copy-paste logic.
disable = [
    "invalid-name",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "empty-docstring",
    "line-too-long",
    "consider-using-f-string",
    "consider-using-dict-items",
    "trailing-whitespace",
    "missing-final-newline",
    "consider-using-from-import",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "no-else-return",
    "inconsistent-return-statements",
    "unnecessary-comprehension",
    "use-dict-literal",
    "unnecessary-lambda",
    "attribute-defined-outside-init",
    "unused-variable",
    "unused-argument",
    "redefined-outer-name",
    "broad-exception-caught",
    "no-member",
    "arguments-differ",
    "duplicate-code",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".", "src"
]
testpaths = [
    "tests"
]
