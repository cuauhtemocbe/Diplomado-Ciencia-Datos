[tool.poetry]
name = "diplomado"
version = "0.2.0"
description = ""
authors = ["Kuautli <cuauhtemocbe@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.25.0"
plotly = "^5.16.0"
python-dotenv = "^1.0.1"
flask = "^3.0.3"
google-api-python-client = "^2.143.0"
scipy = "^1.11.3"
sentence-transformers = "^3.0.1"
scikit-learn = "^1.4.2"
gunicorn = "^23.0.0"
wordcloud = "^1.9.3"
pandas = "^2.2.3"
keras = "^3.5.0"
tensorflow = "^2.17.0"
tf-keras = "^2.17.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
beautifulsoup4 = "^4.12.3"
seaborn = "^0.13.2"
cufflinks = "^0.17.3"
nbformat = "^5.10.4"
jupyterlab = "^4.1.6"
dash = "^2.17.0"
varclushi = "^0.1.0"
unidecode = "^1.3.8"
black = "^24.4.2"
xgboost = "^2.0.3"
nltk = "^3.8.1"
isort = "^5.13.2"
pylint = "^3.2.0"
wfdb = "^4.1.2"
neurokit2 = "^0.2.9"
pyproj = "^3.6.1"
geopandas = "^1.0.1"
shap = "^0.46.0"
phik = "^0.12.4"
umap-learn = "^0.5.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint."messages control"]
# This repo is exploratory/educational data-science code (notebooks +
# supporting src/ modules), not a production service — several default
# pylint checks fight conventions that are standard in that context
# rather than catching real bugs. Disabled deliberately, not by default:
#   - invalid-name: X_train/X_test/X/Q1/Q3/IQR are scikit-learn/stats
#     convention, not a naming-style violation.
#   - missing-*-docstring / empty-docstring: most functions here are
#     short, single-purpose analysis helpers; low value for this repo.
#   - line-too-long: plotting/pandas chains are frequently long one-liners.
#   - too-many-arguments/positional-arguments/locals: inherent to
#     multi-parameter ML pipeline functions, not a sign of bad design here.
#   - use-dict-literal: dict(...) is idiomatic in plotly's own API surface.
#   - unused-variable/unused-argument: common in exploratory code
#     (discarded plot handles, callback-required signatures).
#   - redefined-outer-name: parameters intentionally shadowing a
#     module-level default (e.g. api_key) is an explicit-dependency
#     pattern, not a bug.
#   - broad-exception-caught: acceptable for top-level notebook/app
#     error handling in a solo-maintainer project.
disable = [
    "invalid-name",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "empty-docstring",
    "line-too-long",
    "consider-using-f-string",
    "consider-using-dict-items",
    "trailing-whitespace",
    "missing-final-newline",
    "consider-using-from-import",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "no-else-return",
    "inconsistent-return-statements",
    "unnecessary-comprehension",
    "use-dict-literal",
    "unnecessary-lambda",
    "attribute-defined-outside-init",
    "unused-variable",
    "unused-argument",
    "redefined-outer-name",
    "broad-exception-caught",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".", "src"
]
testpaths = [
    "tests"
]
