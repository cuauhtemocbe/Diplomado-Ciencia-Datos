name: Dependabot Socket Firewall

# Gatea los PRs que abre Dependabot (issue #61): antes de que alguien los revise a mano,
# reinstala las dependencias del PR a través de Socket Firewall Free (sfw) y cierra el PR
# si esa instalación falla. Parte de cuauhtemocbe/meta-projects#47; enfoque de Poetry validado
# en el spike de DataScience-Docker (PR #38).
#
# Por qué `poetry export` + `sfw pip install` y no `sfw poetry install`: sfw no soporta Poetry
# (solo npm/yarn/pnpm/pip/uv/cargo). Verificado con sfw 1.15.2: `sfw poetry install` falla con
# CERTIFICATE_VERIFY_FAILED porque requests/certifi no confía en la CA del proxy de sfw (sfw exporta
# SSL_CERT_FILE y PIP_CERT, pero no REQUESTS_CA_BUNDLE). Ese fallo no es un bloqueo del firewall y
# cerraría todos los PRs. pip sí es un gestor soportado, así que el lock se exporta y se instala con pip.
on:
  pull_request:
    branches: [main]

jobs:
  socket-check:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Desde 2021-10, los workflows disparados por PRs de Dependabot respetan este bloque
    # (antes corrían siempre con GITHUB_TOKEN de solo lectura) — sin esto, "gh pr close" abajo
    # fallaría por falta de permisos.
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Misma versión que pylint.yml y Dockerfile.dev (excepto tensorflow-env). pyproject.toml exige
      # python >=3.13,<4.0: con un intérprete fuera de ese rango `poetry export` emitiría marcadores
      # que pip ignoraría todos, con lo que sfw no vería ningún paquete.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Poetry 2.5.1 (la versión que generó poetry.lock, lock-version 2.1) + poetry-plugin-export,
      # que desde Poetry 2.0 ya no viene incluido. No se usa Poetry 1.8.x como en otros repos:
      # exporta este lock pero avisa "The lock file might not be compatible with the current version
      # of Poetry", su export difiere del de 2.5.1 (extras bleach[css]/jsonschema[format-nongpl],
      # orden de marcadores) y en Python 3.14 compila dulwich desde fuente. Se instala antes de
      # SocketDev/action, por lo que Poetry en sí no pasa por el firewall.
      - name: Exportar el lock a requirements
        run: |
          pip install poetry==2.5.1 poetry-plugin-export==1.10.1
          # --with dev: `poetry install` instala el grupo dev y `export` lo omite por defecto;
          # sin esto los bumps de pytest/black/pylint (la mayoría de los PRs de dev) no pasarían
          # por sfw. Los grupos opcionales (tensorflow, nlp, geo, bio, explain) siguen fuera:
          # tensorflow no tiene wheel cp314 y torch viene de un índice aparte, así que exportarlos
          # cerraría PRs por errores de instalación ajenos al firewall.
          poetry export -f requirements.txt --without-hashes --with dev -o /tmp/req.txt

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      # Solo este paso es continue-on-error: si `poetry export` falla (lock inconsistente) el job
      # queda en rojo pero el PR no se cierra. Un fallo aquí puede ser un bloqueo del firewall o
      # cualquier otro error de instalación (red, PyPI caído, wheel que no compila); el paso de
      # abajo no los distingue.
      - name: Instalar con firewall
        id: install
        run: sfw pip install -r /tmp/req.txt
        continue-on-error: true

      - name: Cerrar PR si el firewall bloqueó algo
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} \
            --comment "🚫 La instalación con Socket Firewall (\`sfw pip install -r\`) falló: puede ser un bloqueo por comportamiento malicioso/sospechoso o un error de instalación no relacionado (red, PyPI, build). Cerrado automáticamente — revisar el log del job y reabrir manualmente si es un falso positivo."
