name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip poetry
        # nlp group is needed so src/app_clustering/*.py (sentence-transformers,
        # flask, wordcloud) doesn't fail pylint's import-error check.
        poetry install --no-root --with nlp
    - name: Verificar que poetry.lock esté sincronizado
      run: poetry check --lock
    - name: Analysing the code with pylint
      run: |
        poetry run pylint $(git ls-files '*.py')
