name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip poetry
        # nlp group is needed so src/app_clustering/*.py (sentence-transformers,
        # flask, wordcloud) doesn't fail pylint's import-error check.
        poetry install --no-root --with nlp
    - name: Verificar que poetry.lock esté sincronizado
      run: poetry check --lock
    - name: Analysing the code with pylint
      run: |
        poetry run pylint $(git ls-files '*.py')
    - name: Checking formatting with black
      run: poetry run black --check $(git ls-files '*.py')
    - name: Checking import order with isort
      run: poetry run isort --check-only $(git ls-files '*.py')
